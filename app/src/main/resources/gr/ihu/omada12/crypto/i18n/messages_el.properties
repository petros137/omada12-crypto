# --- Οδηγός πρώτης χρήσης (APP-12)
tutorial.title=Οδηγός πρώτης χρήσης
tutorial.prev=Πίσω
tutorial.next=Επόμενο
tutorial.close=Κλείσιμο
tutorial.1.title=Καλώς ήρθατε!
tutorial.1.body=Η εφαρμογή προστατεύει τα προσωπικά σας δεδομένα. Όλα γίνονται τοπικά: τίποτα δεν στέλνεται στο διαδίκτυο.
tutorial.2.title=Κρυπτογράφηση με κωδικό
tutorial.2.body=Στην ενότητα «Κρυπτογράφηση» κλειδώνετε κείμενο, οποιοδήποτε αρχείο (.enc) ή PDF με έναν κωδικό. Χωρίς τον σωστό κωδικόδεν ανοίγουν.
tutorial.3.title=Secure Vault
tutorial.3.body=Το θησαυροφυλάκιο είναι ένα κρυπτογραφημένο αρχείο με κύριο κωδικό. Ο κωδικός δεν ανακτάται: φυλάξτε τον καλά. Κλειδώνει μόνο του μετά από αδράνεια.
tutorial.4.title=Υπογραφή και στεγανογραφία
tutorial.4.body=Υπογράψτε αρχεία για να αποδεικνύετε ότι δεν άλλαξαν, ή κρύψτε ένα μήνυμα μέσα σε εικόνα PNG.
tutorial.5.title=Βοήθεια παντού
tutorial.5.body=Το κουμπί «?» πάνω δεξιά εξηγεί κάθε οθόνη. Τα «Πίσω» και «Αρχική» σας γυρίζουν όπου θέλετε. Γλώσσα και θέμα αλλάζουν στις Ρυθμίσεις.

# --- Βοήθεια ανά οθόνη (APP-11)
help.home=Επιλέξτε μία από τις 6 ενότητες. Κάθε βασική ενέργεια ολοκληρώνεται σε λίγα κλικ.\n\n«Έξοδος» κλείνει την εφαρμογή μετά από επιβεβαίωση. Αν υπάρχει ανοιχτό θησαυροφυλάκιο, κλειδώνει αυτόματα.
help.encryption=ΚΕΙΜΕΝΟ: διαλέξτε αλγόριθμο. Το AES-256 με κωδικό είναι η ασφαλής επιλογή. Τα Caesar και Vigenère είναι εκπαιδευτικά. Με «AES-256 (key)» δουλεύετε με τυχαίο κλειδί που αποθηκεύετε σε αρχείο.\n\nΑΡΧΕΙΑ: σύρετε αρχεία ή φάκελο, δώστε κωδικό δύο φορές και πατήστε «Κρυπτογράφηση». Δημιουργείται αρχείο .enc. Για αποκρυπτογράφηση επιλέξτε ένα .enc και δώστε τον κωδικό. Με λάθος κωδικό ή αλλοιωμένο αρχείο δεν δημιουργείται αρχείο.\n\nPDF: το κλειδωμένο PDF ανοίγει με τον κωδικό σε κάθε PDF reader.
help.vault_list=Επιλέξτε θησαυροφυλάκιο, δώστε τον κύριο κωδικό και πατήστε «Ξεκλείδωμα». Μετά από 3 λάθη υπάρχει αναμονή πριν από την επόμενη προσπάθεια.\n\nΓια νέο θησαυροφυλάκιο: όνομα, κύριος κωδικός (τουλάχιστον «Μέτριος») και επιβεβαίωση. Ο κωδικός ΔΕΝ ανακτάται.
help.vault=Προσθέστε αρχεία με το κουμπί ή σύροντάς τα στον πίνακα. Αποθηκεύονται κρυπτογραφημένα μέσα στο θησαυροφυλάκιο. Τα αρχικά αρχεία δεν αλλάζουν: σβήστε τα μόνοι σας αν θέλετε.\n\nΑναζήτηση και φίλτρα: όνομα, τύπος, ετικέτα, ημερομηνία. Διπλό κλικ = προεπισκόπηση εικόνας/κειμένου χωρίς εξαγωγή.\n\n«Κλείδωμα» σβήνει τα δεδομένα από τη μνήμη. Κλειδώνει και αυτόματα μετά από αδράνεια(Ρυθμίσεις).
help.signature=ΚΛΕΙΔΙΑ: δημιουργήστε ζεύγος. Το ιδιωτικό (.o12key) προστατεύεται με κωδικό και το κρατάτε μόνο εσείς. Το δημόσιο (.pub)το στέλνετε σε όποιον θέλει να ελέγχει τις υπογραφές σας.\n\nΥΠΟΓΡΑΦΗ: αρχείο + ιδιωτικό κλειδί → αρχείο .sig.\n\nΕΠΑΛΗΘΕΥΣΗ: αρχείο + .sig + δημόσιο κλειδί → «Έγκυρη» ή «Μη έγκυρη». Αρκεί να αλλάξει ένα byte για να γίνει μη έγκυρη.\n\nSHA-256: αποτύπωμα αρχείου και σύγκριση δύο αρχείων.
help.stego=ΑΠΟΚΡΥΨΗ: επιλέξτε εικόνα PNG ή BMP, γράψτε μήνυμα (ή επιλέξτε μικρό αρχείο) και πατήστε «Απόκρυψη». Η νέα εικόνα αποθηκεύεται πάντα ως PNG και φαίνεται ίδια με την αρχική. Η ένδειξη δείχνει πόσα bytes χωράνε. Προαιρετικά, το μήνυμα κρυπτογραφείται με κωδικό.\n\nΑΝΑΚΤΗΣΗ: επιλέξτε την εικόνα (και κωδικό αν χρειάζεται).
help.lab=ΣΥΓΚΡΙΣΗ: μετρά χρόνο και ταχύτητα AES-GCM, AES-CBC και ChaCha20-Poly1305 σε δικό σας αρχείο, Ν φορές, και δείχνει μέσους όρους, γράφημα και CSV.\n\nCAESAR: brute force και των 25 μετατοπίσεων με κατάταξη χ² και ραβδόγραμμα συχνοτήτων.\n\nΚΩΔΙΚΟΙ: έλεγχος ισχύος με εκτίμηση χρόνου «σπασίματος» και γεννήτρια.\n\nΒΗΜΑ-ΒΗΜΑ: δείτε πώς δουλεύουν Caesar και Vigenère γράμμα-γράμμα.
help.general=ΡΥΘΜΙΣΕΙΣ: γλώσσα, θέμα, χρώμα, χρόνος αυτόματου κλειδώματος, ιστορικό. Αποθηκεύονται αμέσως και ισχύουν και μετά την επανεκκίνηση.\n\nΙΣΤΟΡΙΚΟ: κάθε ενέργεια με ημερομηνία και αποτέλεσμα, χωρίς κωδικούς ή περιεχόμενο. Φιλτράρισμα και καθαρισμός.

