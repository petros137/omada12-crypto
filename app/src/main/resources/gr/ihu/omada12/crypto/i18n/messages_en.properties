# --- First-run tutorial (APP-12)
tutorial.title=First-run tutorial
tutorial.prev=Back
tutorial.next=Next
tutorial.close=Close
tutorial.1.title=Welcome!
tutorial.1.body=This application protects your personal data. Everything happens locally: nothing is sent to the internet.
tutorial.2.title=Encryption with a password
tutorial.2.body=In "Encryption" you lock text, any file (.enc) or a PDF with a password. Without the right password they do not open.
tutorial.3.title=Secure Vault
tutorial.3.body=A vault is an encrypted file with a master password. The password cannot be recovered: keep it safe. The vault locks itself after inactivity.
tutorial.4.title=Signatures and steganography
tutorial.4.body=Sign files to prove they did not change, or hide a message inside a PNG image.
tutorial.5.title=Help everywhere
tutorial.5.body=The "?" button at the top right explains every screen. "Back" and "Home" take you wherever you want. Language and themeare in Settings.

# --- Help per screen (APP-11)
help.home=Choose one of the 6 modules. Every basic action takes just a few clicks.\n\n"Exit" closes the application after confirmation.An open vault is locked automatically.
help.encryption=TEXT: choose an algorithm. AES-256 with a password is the safe choice. Caesar and Vigenère are for learning. With "AES-256 (key)" you work with a random key that you save to a file.\n\nFILES: drop files or a folder, type the password twice and press "Encrypt". An .enc file is created. To decrypt, choose one .enc file and type the password. With a wrong password or a damaged file no file is created.\n\nPDF: a locked PDF opens with the password in every PDF reader.
help.vault_list=Select a vault, type the master password and press "Unlock". After 3 wrong attempts you must wait before the next one.\n\nFor a new vault: name, master password (at least "Fair") and confirmation. The password CANNOT be recovered.
help.vault=Add files with the button or by dropping them on the table. They are stored encrypted inside the vault. The original files do not change: delete them yourself if you want.\n\nSearch and filters: name, type, tag, date. Double click = preview an image ortext without exporting it.\n\n"Lock" wipes the data from memory. The vault also locks automatically after inactivity (Settings).
help.signature=KEYS: generate a key pair. The private key (.o12key) is protected by a password and only you keep it. You send the public key (.pub) to anyone who wants to check your signatures.\n\nSIGN: file + private key → .sig file.\n\nVERIFY: file + .sig + public key → "Valid" or "Not valid". Changing a single byte makes it not valid.\n\nSHA-256: fingerprint of a file and comparison oftwo files.
help.stego=HIDE: choose a PNG or BMP image, type a message (or choose a small file) and press "Hide". The new image is always saved as PNG and looks the same as the original. The indicator shows how many bytes fit. Optionally the message is encrypted with a password.\n\nREVEAL: choose the image (and the password if needed).
help.lab=COMPARE: measures time and speed of AES-GCM, AES-CBC and ChaCha20-Poly1305 on your own file, N times, and shows averages, a chart and CSV.\n\nCAESAR: brute force of all 25 shifts ranked with chi-squared, plus a letter frequency chart.\n\nPASSWORDS: strength check with an estimated cracking time, and a generator.\n\nSTEP BY STEP: see how Caesar and Vigenère work letter by letter.
help.general=SETTINGS: language, theme, colour, auto-lock time, history. They are saved immediately and kept after a restart.\n\nHISTORY: every action with date and result, without passwords or content. Filter and clear.

