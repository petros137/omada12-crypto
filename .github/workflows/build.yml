name: Maven build and tests

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Java 17 — Maven test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress -f app/pom.xml test
